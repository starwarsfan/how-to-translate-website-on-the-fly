name: Release

on:
  push:
    tags:
      - '*'

permissions: {}

jobs:
  release:
    name: Build PDFs and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag '${GITHUB_REF_NAME}' (commit ${GITHUB_SHA}) is not on main. Tags must be created from main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Convert Markdown to PDF
        run: ./scripts/build-pdfs.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automatisch generierte PDF-Version der Anleitung „Webseite automatisch übersetzen“ (Deutsch, Französisch, Italienisch).
          files: |
            webseite-uebersetzen.pdf
            traduire-site-web.pdf
            tradurre-sito-web.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
