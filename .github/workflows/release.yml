name: Release

on:
  push:
    tags:
      - '*'

permissions: {}

jobs:
  release:
    name: Build PDFs and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag '${GITHUB_REF_NAME}' (commit ${GITHUB_SHA}) is not on main. Tags must be created from main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Convert Markdown to PDF
        run: ./scripts/build-pdfs.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automatisch generierte PDF-Version der Anleitung „Webseite automatisch übersetzen“ (Deutsch, Französisch, Italienisch).

            Direkt im Browser lesen (statt Download): https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: |
            webseite-uebersetzen.pdf
            traduire-site-web.pdf
            tradurre-sito-web.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PDFs as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            webseite-uebersetzen.pdf
            traduire-site-web.pdf
            tradurre-sito-web.pdf
          retention-days: 1

  publish-pages:
    name: Publish PDFs to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download PDFs artifact
        uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: pages-site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
